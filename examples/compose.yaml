# A small SaaS stack with typical production pitfalls.
# Try it: eyeship compose examples/compose.yaml
x-defaults: &defaults
  restart: unless-stopped
  mem_limit: 512m
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  api:
    <<: *defaults
    image: ghcr.io/acme/api:latest
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://app:${DB_PASSWORD}@db:5432/app

  worker:
    <<: *defaults
    image: ghcr.io/acme/api:1.4.2
    command: ["worker"]
    ports:
      - "8080:8081"
    networks: [backend]

  db:
    <<: *defaults
    image: postgres:16
    volumes:
      - pgdata:/var/lib/postgresql/data
