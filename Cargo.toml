[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
eyeship-domain = { path = "crates/eyeship-domain" }
eyeship-compose = { path = "crates/eyeship-compose" }
eyeship-report = { path = "crates/eyeship-report" }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
